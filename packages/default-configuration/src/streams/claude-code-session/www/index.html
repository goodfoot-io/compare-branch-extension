<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Code Session</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--vscode-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
      font-size: var(--vscode-font-size, 13px);
      color: var(--vscode-foreground, #cccccc);
      background: var(--vscode-editor-background, #1e1e1e);
      overflow: visible;
      line-height: 1.5;
    }

    /* In expanded mode the host wrapper is the sole scroll container.
       Prevent the iframe body from generating a competing scrollbar. */
    body.mode-expanded {
      overflow: hidden;
    }

    /* =========================================================
       ROOT CONTAINERS
       ========================================================= */

    #compact-root {
      display: none;
      padding: 2px 8px 4px;
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 0.85em;
      overflow: hidden;
    }

    #expanded-root {
      display: none;
      flex-direction: column;
      min-height: 0;
    }

    body.mode-compact #compact-root {
      display: block;
    }

    body.mode-expanded #expanded-root {
      display: flex;
    }

    /* =========================================================
       COMPACT VIEW
       ========================================================= */

    .cc-compact-header {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .cc-compact-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px; /* optical alignment with first text line */
      background: var(--vscode-charts-yellow, #cca700);
    }

    .cc-compact-status-dot.status-success {
      background: var(--vscode-charts-green, #89d185);
    }

    .cc-compact-status-dot.status-error {
      background: var(--vscode-charts-red, #f48771);
    }

    .cc-compact-prompt {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
      color: var(--vscode-descriptionForeground, #858585);
      font-size: 0.9em;
      word-break: break-word;
      flex: 1;
      min-width: 0;
    }

    .cc-compact-meta {
      font-size: 0.8em;
      color: var(--vscode-descriptionForeground, #858585);
      margin-top: 2px;
      padding-left: 13px; /* align under text past the dot */
    }

    /* =========================================================
       EXPANDED VIEW — SESSION HEADER
       ========================================================= */

    .cc-session-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--vscode-panel-border, #3c3c3c);
      background: var(--vscode-editor-background, #1e1e1e);
      flex-shrink: 0;
      font-size: 0.82em;
      color: var(--vscode-descriptionForeground, #858585);
    }

    .cc-session-header-model {
      font-family: var(--vscode-editor-font-family, monospace);
      color: var(--vscode-foreground, #cccccc);
    }

    .cc-session-header-sep {
      color: var(--vscode-panel-border, #3c3c3c);
    }

    .cc-session-header-cwd {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--vscode-editor-font-family, monospace);
    }

    .cc-session-header-status {
      flex-shrink: 0;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--vscode-descriptionForeground, #858585);
      margin-left: auto;
    }

    .cc-session-header-status.status-running {
      background: var(--vscode-charts-yellow, #cca700);
    }

    .cc-session-header-status.status-success {
      background: var(--vscode-charts-green, #89d185);
    }

    .cc-session-header-status.status-error {
      background: var(--vscode-charts-red, #f48771);
    }

    /* =========================================================
       EXPANDED VIEW — TRANSCRIPT AREA
       ========================================================= */

    .cc-transcript {
      padding: 12px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: visible;
    }

    /* =========================================================
       TURN LAYOUT
       ========================================================= */

    .cc-turn {
      display: flex;
      flex-direction: column;
      max-width: 100%;
      margin-bottom: 10px;
    }

    /* Reduce gap between consecutive turns of the same role */
    .cc-turn.cc-user + .cc-turn.cc-user,
    .cc-turn.cc-assistant + .cc-turn.cc-assistant {
      margin-top: -6px;
    }

    /* User turns: full-width with left-border role indicator */
    .cc-turn.cc-user {
      align-items: flex-start;
      width: 100%;
    }

    .cc-turn.cc-user .cc-bubble {
      background: color-mix(in srgb, var(--vscode-focusBorder, #007fd4) 8%, transparent);
      border-left: 3px solid var(--vscode-focusBorder, #007fd4);
      padding: 7px 10px;
      width: 100%;
    }

    /* Assistant turns: left-aligned, no bubble */
    .cc-turn.cc-assistant {
      align-items: flex-start;
      width: 100%;
    }

    .cc-turn.cc-assistant .cc-bubble {
      width: 100%;
    }

    /* =========================================================
       TEXT CONTENT
       ========================================================= */

    .cc-text {
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .cc-text p {
      margin: 0 0 6px;
    }

    .cc-text p:last-child {
      margin-bottom: 0;
    }

    .cc-text h1, .cc-text h2, .cc-text h3, .cc-text h4 {
      margin: 10px 0 4px;
      font-weight: 600;
      line-height: 1.3;
    }

    .cc-text h1 { font-size: 1.15em; }
    .cc-text h2 { font-size: 1.05em; }
    .cc-text h3, .cc-text h4 { font-size: 1em; }

    .cc-text code {
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 0.88em;
      background: var(--vscode-textCodeBlock-background, #0a0a0a);
      border: 1px solid var(--vscode-panel-border, #3c3c3c);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .cc-text pre {
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 0.88em;
      background: var(--vscode-textCodeBlock-background, #0a0a0a);
      border: 1px solid var(--vscode-panel-border, #3c3c3c);
      padding: 10px 12px;
      border-radius: 4px;
      max-width: 100%;
      box-sizing: border-box;
      white-space: pre-wrap;
      overflow-x: auto;
      margin: 6px 0;
    }

    .cc-text pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: inherit;
    }

    .cc-text ul, .cc-text ol {
      padding-left: 20px;
      margin: 4px 0;
    }

    .cc-text li {
      margin: 2px 0;
    }

    .cc-text blockquote {
      border-left: 3px solid var(--vscode-panel-border, #3c3c3c);
      margin: 6px 0;
      padding: 2px 10px;
      color: var(--vscode-descriptionForeground, #858585);
    }

    .cc-text a {
      color: var(--vscode-textLink-foreground, #3794ff);
      text-decoration: none;
    }

    .cc-text hr {
      border: none;
      border-top: 1px solid var(--vscode-panel-border, #3c3c3c);
      margin: 8px 0;
    }

    .cc-text strong { font-weight: 600; }
    .cc-text em { font-style: italic; }

    /* =========================================================
       THINKING BLOCK — collapsible, collapsed by default
       ========================================================= */

    .cc-thinking-accordion {
      margin: 4px 0;
      border-left: 2px solid var(--vscode-descriptionForeground, #858585);
    }

    .cc-thinking-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--vscode-descriptionForeground, #858585);
      font-family: inherit;
      font-size: 0.82em;
      width: 100%;
      text-align: left;
    }

    .cc-thinking-toggle:hover {
      color: var(--vscode-foreground, #cccccc);
    }

    .cc-thinking-chevron {
      font-size: 0.7em;
      transition: opacity 0.1s ease;
      font-style: normal;
    }

    .cc-thinking-body {
      display: none;
      padding: 6px 8px;
      font-size: 0.85em;
      color: var(--vscode-descriptionForeground, #858585);
      white-space: pre-wrap;
      word-break: break-word;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    .cc-thinking-accordion.open .cc-thinking-body {
      display: block;
      opacity: 1;
    }

    /* =========================================================
       TOOL ACCORDION — collapsed by default
       ========================================================= */

    .cc-tool-accordion {
      margin: 4px 0;
      border-left: 2px solid var(--vscode-panel-border, #3c3c3c);
    }

    .cc-tool-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--vscode-foreground, #cccccc);
      font-family: inherit;
      font-size: 0.82em;
      width: 100%;
      text-align: left;
    }

    .cc-tool-toggle:hover {
      background: var(--vscode-list-hoverBackground, #2a2d2e);
    }

    .cc-tool-badge {
      display: inline-block;
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 0.9em;
      background: var(--vscode-badge-background, #4d4d4d);
      color: var(--vscode-badge-foreground, #ffffff);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .cc-tool-preview {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--vscode-descriptionForeground, #858585);
      font-family: var(--vscode-editor-font-family, monospace);
    }

    .cc-tool-chevron {
      font-size: 0.7em;
      flex-shrink: 0;
      color: var(--vscode-descriptionForeground, #858585);
      transition: opacity 0.1s ease;
    }

    .cc-tool-body {
      display: none;
      padding: 4px 8px 8px;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    .cc-tool-accordion.open .cc-tool-body {
      display: block;
      opacity: 1;
    }

    .cc-tool-input-table {
      border-collapse: collapse;
      font-size: 0.85em;
      font-family: var(--vscode-editor-font-family, monospace);
      width: 100%;
      margin-bottom: 6px;
    }

    .cc-tool-input-table td {
      padding: 2px 6px;
      vertical-align: top;
    }

    .cc-tool-input-key {
      color: var(--vscode-symbolIcon-propertyForeground, #9cdcfe);
      text-align: right;
      white-space: nowrap;
      width: 1%;
    }

    .cc-tool-input-val {
      color: var(--vscode-foreground, #cccccc);
      word-break: break-all;
    }

    .cc-tool-result {
      font-size: 0.85em;
      color: var(--vscode-descriptionForeground, #858585);
      font-family: var(--vscode-editor-font-family, monospace);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
    }

    .cc-tool-result-label {
      font-size: 0.8em;
      color: var(--vscode-descriptionForeground, #858585);
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* =========================================================
       SYSTEM LINES
       ========================================================= */

    .cc-system-line {
      font-size: 0.8em;
      color: var(--vscode-descriptionForeground, #858585);
      padding: 3px 0;
      font-style: italic;
    }

    .cc-session-boundary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      margin: 4px 0;
      font-size: 0.8em;
      color: var(--vscode-descriptionForeground, #858585);
    }

    .cc-session-boundary::before,
    .cc-session-boundary::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--vscode-panel-border, #3c3c3c);
    }

    .cc-compact-boundary-line {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 0.8em;
      color: var(--vscode-descriptionForeground, #858585);
      font-style: italic;
    }

    .cc-compact-boundary-line::before,
    .cc-compact-boundary-line::after {
      content: '';
      flex: 1;
      height: 1px;
      border-top: 1px dashed var(--vscode-panel-border, #3c3c3c);
    }

    .cc-error-line {
      font-size: 0.85em;
      color: var(--vscode-charts-red, #f48771);
      padding: 4px 8px;
      border-left: 2px solid var(--vscode-charts-red, #f48771);
      font-family: var(--vscode-editor-font-family, monospace);
    }

    .cc-hook-line {
      font-size: 0.78em;
      color: var(--vscode-descriptionForeground, #858585);
      padding: 1px 0;
      font-family: var(--vscode-editor-font-family, monospace);
    }

    /* =========================================================
       EMPTY / LOADING
       ========================================================= */

    .cc-empty {
      color: var(--vscode-descriptionForeground, #858585);
      font-style: italic;
      padding: 16px 14px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div id="compact-root"></div>
  <div id="expanded-root">
    <div id="session-header" class="cc-session-header" style="display:none;"></div>
    <div id="transcript" class="cc-transcript"></div>
  </div>

  <script type="module">
    import { streamStore, observeHeight, requestCollapse } from '@cards/sdk/stream-store';
    import { marked } from 'marked';

    // =========================================================
    // MARKDOWN / HTML HELPERS
    // =========================================================

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * Render markdown to safe HTML. Uses marked if available (bundled by
     * esbuild), otherwise falls back to escapeHtml + <br> for newlines.
     */
    function renderMarkdown(text) {
      try {
        if (typeof marked !== 'undefined' && marked && typeof marked.parse === 'function') {
          // marked.parse returns a string of HTML
          return marked.parse(String(text), { async: false, breaks: true });
        }
      } catch {
        // fall through to fallback
      }
      // Fallback: escape and preserve newlines
      return escapeHtml(String(text)).replace(/\n/g, '<br>');
    }

    const PREVIEW_LEN = 80;

    function truncate(str, len = PREVIEW_LEN) {
      const s = String(str ?? '');
      return s.length > len ? s.slice(0, len) + '…' : s;
    }

    /** Strip XML/HTML tags, markdown syntax, and collapse whitespace for compact one-line display. */
    function stripMarkup(text) {
      return String(text ?? '')
        .replace(/<[^>]+>/g, ' ')      // XML/HTML tags
        .replace(/^#{1,6}\s+/gm, '')   // markdown headings
        .replace(/\*{1,3}([^*]+)\*{1,3}/g, '$1')  // bold/italic
        .replace(/`[^`]+`/g, '')       // inline code
        .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')  // links → text
        .replace(/\s+/g, ' ')
        .trim();
    }

    function formatInputValue(value) {
      if (value === null || value === undefined) return '<em>null</em>';
      if (typeof value === 'string') return escapeHtml(truncate(value, 200));
      return escapeHtml(truncate(JSON.stringify(value), 200));
    }

    // =========================================================
    // COMPACT VIEW STATE
    // =========================================================

    let compactPromptText = '';
    let compactTurns = 0;
    let compactDurationS = 0;
    let compactSessionStatus = 'running';
    // Populated from stream meta at bootstrap; used as fallback when no clean prompt text is found
    let metaTitle = '';

    // =========================================================
    // EXPANDED VIEW STATE
    // =========================================================

    // Session init info for the sticky header
    let sessionModel = '';
    let sessionCwd = '';
    let sessionStatus = 'running'; // 'running' | 'success' | 'error'

    // Pending tool_use blocks keyed by tool_use id (for expanded view)
    const pendingToolUses = new Map();

    // =========================================================
    // COMPACT RENDER
    // =========================================================

    function renderCompact(lines, initialStatus) {
      // Extract compact data from lines
      compactPromptText = '';
      compactTurns = 0;
      compactDurationS = 0;
      compactSessionStatus = initialStatus ?? 'running';

      for (const line of lines) {
        if (!line || !line.trim()) continue;
        let msg;
        try { msg = JSON.parse(line); } catch { continue; }

        if (msg.type === 'user' && !msg.tool_use_result) {
          const content = msg.message?.content;
          let text = '';
          if (typeof content === 'string') {
            text = content;
          } else if (Array.isArray(content)) {
            for (const block of content) {
              if (block?.type === 'text' && typeof block.text === 'string') {
                text += block.text;
              }
            }
          }
          // Strip XML/HTML tags, then reject JSON-looking content (e.g. raw
          // coordination messages embedded in user turns by multi-agent sessions).
          const cleaned = stripMarkup(text);
          const looksLikeData = /^\s*[{[<]/.test(cleaned);
          if (cleaned && !looksLikeData) compactPromptText = cleaned;
        }

        if (msg.type === 'result') {
          compactTurns = msg.num_turns ?? 0;
          compactDurationS = Math.round((msg.duration_ms ?? 0) / 1000);
          compactSessionStatus = msg.subtype === 'success' ? 'success' : 'error';
        }
      }

      applyCompactDom();
    }

    function applyCompactDom() {
      const root = document.getElementById('compact-root');

      const summaryText = compactPromptText || metaTitle;
      const promptDisplay = summaryText
        ? escapeHtml(summaryText)
        : '<em style="color:var(--vscode-descriptionForeground)">Claude Code session</em>';

      const dotClass = compactSessionStatus === 'success'
        ? 'cc-compact-status-dot status-success'
        : compactSessionStatus === 'error'
          ? 'cc-compact-status-dot status-error'
          : 'cc-compact-status-dot';

      const metaParts = [];
      if (compactDurationS > 0) metaParts.push(`${compactDurationS}s`);
      if (compactTurns > 0) metaParts.push(`${compactTurns} turn${compactTurns !== 1 ? 's' : ''}`);
      const metaHtml = metaParts.length > 0
        ? `<div class="cc-compact-meta">${metaParts.join(' · ')}</div>`
        : '';

      root.innerHTML = `
        <div class="cc-compact-header">
          <span class="${dotClass}"></span>
          <span class="cc-compact-prompt">${promptDisplay}</span>
        </div>
        ${metaHtml}
      `;
    }

    function updateCompactStats(newStatus, turns, durationS) {
      compactSessionStatus = newStatus;
      compactTurns = turns;
      compactDurationS = durationS;
    }

    // =========================================================
    // EXPANDED — SESSION HEADER
    // =========================================================

    function renderSessionHeader() {
      const headerEl = document.getElementById('session-header');
      if (!headerEl) return;
      if (!sessionModel && !sessionCwd) {
        headerEl.style.display = 'none';
        return;
      }
      headerEl.style.display = 'flex';
      const statusClass = sessionStatus === 'running'
        ? 'status-running'
        : sessionStatus === 'success'
          ? 'status-success'
          : 'status-error';

      let html = '';
      if (sessionModel) {
        html += `<span class="cc-session-header-model">${escapeHtml(sessionModel)}</span>`;
      }
      if (sessionModel && sessionCwd) {
        html += `<span class="cc-session-header-sep">·</span>`;
      }
      if (sessionCwd) {
        html += `<span class="cc-session-header-cwd" title="${escapeHtml(sessionCwd)}">${escapeHtml(sessionCwd)}</span>`;
      }
      html += `<span class="cc-session-header-status ${statusClass}" id="cc-header-status"></span>`;
      headerEl.innerHTML = html;
    }

    function updateSessionHeaderStatus(newStatus) {
      sessionStatus = newStatus;
      const dot = document.getElementById('cc-header-status');
      if (dot) {
        dot.className = 'cc-session-header-status status-' + newStatus;
      }
    }

    // =========================================================
    // EXPANDED — TRANSCRIPT RENDERING
    // =========================================================

    /**
     * Build an accordion DOM element (for thinking or tool blocks).
     * Returns an HTMLElement ready to append.
     */
    function makeThinkingAccordion(thinkingText) {
      const el = document.createElement('div');
      el.className = 'cc-thinking-accordion';

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cc-thinking-toggle';
      btn.setAttribute('aria-expanded', 'false');
      btn.innerHTML = `<span class="cc-thinking-chevron">▶</span><span>Thinking…</span>`;

      const body = document.createElement('div');
      body.className = 'cc-thinking-body';
      body.textContent = thinkingText;

      btn.addEventListener('click', () => {
        const isOpen = el.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(isOpen));
        btn.querySelector('.cc-thinking-chevron').textContent = isOpen ? '▼' : '▶';
        if (isOpen) {
          body.style.opacity = '0';
          requestAnimationFrame(() => { body.style.opacity = '1'; });
        }
      });

      el.appendChild(btn);
      el.appendChild(body);
      return el;
    }

    function makeToolAccordion(toolName, toolInput, toolResult) {
      const el = document.createElement('div');
      el.className = 'cc-tool-accordion';

      // Build a short preview of key arguments
      const entries = Object.entries(toolInput ?? {});
      let previewStr = '';
      if (entries.length > 0) {
        const [firstKey, firstVal] = entries[0];
        const valStr = typeof firstVal === 'string' ? firstVal : JSON.stringify(firstVal);
        previewStr = truncate(`${firstKey}=${valStr}`, 50);
      }

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cc-tool-toggle';
      btn.setAttribute('aria-expanded', 'false');
      btn.innerHTML = `
        <span class="cc-tool-badge">${escapeHtml(toolName)}</span>
        <span class="cc-tool-preview">${escapeHtml(previewStr)}</span>
        <span class="cc-tool-chevron">▶</span>
      `;

      // Build body content
      const body = document.createElement('div');
      body.className = 'cc-tool-body';

      // Input table
      if (entries.length > 0) {
        const table = document.createElement('table');
        table.className = 'cc-tool-input-table';
        for (const [key, value] of entries) {
          const row = document.createElement('tr');
          row.innerHTML = `<td class="cc-tool-input-key">${escapeHtml(key)}</td><td class="cc-tool-input-val">${formatInputValue(value)}</td>`;
          table.appendChild(row);
        }
        body.appendChild(table);
      }

      // Result
      if (toolResult) {
        const resultLabel = document.createElement('div');
        resultLabel.className = 'cc-tool-result-label';
        resultLabel.textContent = 'Result';
        body.appendChild(resultLabel);

        const resultDiv = document.createElement('div');
        resultDiv.className = 'cc-tool-result';
        resultDiv.textContent = String(toolResult);
        body.appendChild(resultDiv);
      }

      btn.addEventListener('click', () => {
        const isOpen = el.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(isOpen));
        btn.querySelector('.cc-tool-chevron').textContent = isOpen ? '▼' : '▶';
        if (isOpen) {
          body.style.opacity = '0';
          requestAnimationFrame(() => { body.style.opacity = '1'; });
        }
      });

      el.appendChild(btn);
      el.appendChild(body);
      return el;
    }

    /**
     * Renders a parsed message object into one or more DOM nodes.
     * Returns an array of HTMLElement (may be empty).
     */
    function renderMessageToDom(msg) {
      const nodes = [];

      switch (msg.type) {

        case 'system': {
          switch (msg.subtype) {
            case 'init': {
              sessionModel = msg.model || '';
              sessionCwd = msg.cwd || '';
              sessionStatus = 'running';
              renderSessionHeader();

              const el = document.createElement('div');
              el.className = 'cc-session-boundary';
              const toolsCount = msg.tools?.length ?? 0;
              el.textContent = `Session started · ${toolsCount} tool${toolsCount !== 1 ? 's' : ''}`;
              nodes.push(el);
              break;
            }
            case 'status': {
              if (msg.status === 'compacting') {
                const el = document.createElement('div');
                el.className = 'cc-system-line';
                el.textContent = 'Compacting context…';
                nodes.push(el);
              }
              break;
            }
            case 'compact_boundary': {
              const trigger = msg.compact_metadata?.trigger ?? 'auto';
              const preTokens = msg.compact_metadata?.pre_tokens ?? 0;
              const el = document.createElement('div');
              el.className = 'cc-compact-boundary-line';
              el.textContent = `Context compacted (${trigger}) · ${preTokens.toLocaleString()} tokens`;
              nodes.push(el);
              break;
            }
            case 'hook_started': {
              const el = document.createElement('div');
              el.className = 'cc-hook-line';
              el.textContent = `↳ hook ${msg.hook_name ?? ''} (${msg.hook_event ?? ''})`;
              nodes.push(el);
              break;
            }
            case 'hook_progress': {
              const el = document.createElement('div');
              el.className = 'cc-hook-line';
              el.textContent = `  ${msg.hook_name ?? ''}: ${msg.output ?? msg.stdout ?? ''}`;
              nodes.push(el);
              break;
            }
            case 'hook_response': {
              const el = document.createElement('div');
              el.className = 'cc-hook-line';
              const outcome = msg.outcome === 'success' ? '✓' : msg.outcome === 'error' ? '✗' : '○';
              el.textContent = `  ${outcome} ${msg.hook_name ?? ''} ${msg.outcome ?? ''}`;
              nodes.push(el);
              break;
            }
            case 'files_persisted': {
              const saved = msg.files?.length ?? 0;
              const failed = msg.failed?.length ?? 0;
              const el = document.createElement('div');
              el.className = 'cc-system-line';
              el.textContent = failed > 0
                ? `Files persisted: ${saved} saved, ${failed} failed`
                : `Files persisted: ${saved} saved`;
              nodes.push(el);
              break;
            }
            case 'task_notification': {
              const el = document.createElement('div');
              el.className = 'cc-system-line';
              el.textContent = `Task ${msg.task_id ?? ''}: ${msg.status ?? ''} — ${msg.summary ?? ''}`;
              nodes.push(el);
              break;
            }
          }
          break;
        }

        case 'user': {
          const content = msg.message?.content;

          if (Array.isArray(content)) {
            // Render tool_result blocks as tool accordions paired with pending tool_use
            for (const block of content) {
              if (block?.type !== 'tool_result' || !block.tool_use_id) continue;
              const resultContent = typeof block.content === 'string'
                ? block.content
                : Array.isArray(block.content)
                  ? block.content.filter(b => b?.type === 'text').map(b => b.text).join('\n')
                  : '';
              const pending = pendingToolUses.get(block.tool_use_id);
              if (pending) {
                nodes.push(makeToolAccordion(pending.name, pending.input, resultContent));
                pendingToolUses.delete(block.tool_use_id);
              } else {
                nodes.push(makeToolAccordion('tool', {}, resultContent));
              }
            }
          }

          // Classify each text block individually before rendering.
          //
          // Machine-generated blocks (XML coordination messages, JSON payloads)
          // are detected by testing the RAW text before any stripping:
          //   - Starts with < : XML tags (e.g. <teammate-message ...>)
          //   - Starts with { or [ : JSON objects / arrays
          //
          // stripMarkup alone is insufficient — XML that starts with <tag>prose
          // strips to prose and would pass a post-strip heuristic. Testing the
          // raw text catches it before the tags are removed.
          const humanTextParts = [];

          const classifyText = (raw) => {
            if (/^\s*[{[<]/.test(raw)) {
              const stripped = stripMarkup(raw);
              const el = document.createElement('div');
              el.className = 'cc-system-line';
              el.textContent = stripped.length > 120 ? stripped.slice(0, 120) + '…' : stripped;
              nodes.push(el);
            } else {
              humanTextParts.push(raw);
            }
          };

          if (typeof content === 'string') {
            classifyText(content);
          } else if (Array.isArray(content)) {
            for (const block of content) {
              if (block?.type === 'text' && typeof block.text === 'string') {
                classifyText(block.text);
              }
            }
          }

          if (humanTextParts.length === 0) break;
          const text = humanTextParts.join('\n\n');

          const turn = document.createElement('div');
          turn.className = 'cc-turn cc-user';
          const bubble = document.createElement('div');
          bubble.className = 'cc-bubble';
          const textDiv = document.createElement('div');
          textDiv.className = 'cc-text';
          textDiv.innerHTML = renderMarkdown(text);
          bubble.appendChild(textDiv);
          turn.appendChild(bubble);
          nodes.push(turn);
          break;
        }

        case 'assistant': {
          if (msg.error) {
            const el = document.createElement('div');
            el.className = 'cc-error-line';
            el.textContent = `API Error: ${String(msg.error)}`;
            nodes.push(el);
            break;
          }

          const blocks = msg.message?.content ?? [];

          // Register pending tool_use blocks for later pairing with results
          for (const block of blocks) {
            if (block.type === 'tool_use') {
              pendingToolUses.set(block.id, { name: block.name, input: block.input ?? {} });
            }
          }

          // Render non-tool blocks as an assistant turn
          const nonToolBlocks = blocks.filter(b => b.type !== 'tool_use');
          if (nonToolBlocks.length === 0) break;

          const turn = document.createElement('div');
          turn.className = 'cc-turn cc-assistant';
          const bubble = document.createElement('div');
          bubble.className = 'cc-bubble';

          for (const block of nonToolBlocks) {
            if (block.type === 'text' && block.text) {
              // Apply the same data heuristic as user messages: raw text
              // starting with {, [, or < is machine-generated data, not prose.
              if (/^\s*[{[<]/.test(block.text)) {
                const stripped = stripMarkup(block.text);
                const el = document.createElement('div');
                el.className = 'cc-system-line';
                el.textContent = stripped.length > 120 ? stripped.slice(0, 120) + '…' : stripped;
                nodes.push(el);
              } else {
                const textDiv = document.createElement('div');
                textDiv.className = 'cc-text';
                textDiv.innerHTML = renderMarkdown(block.text);
                bubble.appendChild(textDiv);
              }
            } else if (block.type === 'thinking' && block.thinking) {
              bubble.appendChild(makeThinkingAccordion(block.thinking));
            }
          }

          if (bubble.children.length === 0) break;
          turn.appendChild(bubble);
          nodes.push(turn);
          break;
        }

        case 'tool_use_summary': {
          const summary = msg.summary || '';
          const ids = msg.preceding_tool_use_ids ?? [];
          for (const id of ids) {
            const pending = pendingToolUses.get(id);
            if (pending) {
              nodes.push(makeToolAccordion(pending.name, pending.input, summary));
              pendingToolUses.delete(id);
            }
          }
          // If no pending tool found, emit a minimal accordion with just the summary
          if (nodes.length === 0 && summary) {
            nodes.push(makeToolAccordion('tool', {}, summary));
          }
          break;
        }

        case 'result': {
          const turns = msg.num_turns ?? 0;
          const durationS = Math.round((msg.duration_ms ?? 0) / 1000);
          const cost = msg.total_cost_usd != null
            ? ` · $${Number(msg.total_cost_usd).toFixed(4)}`
            : '';
          const isSuccess = msg.subtype === 'success';

          // Update session status
          const newStatus = isSuccess ? 'success' : 'error';
          sessionStatus = newStatus;
          updateSessionHeaderStatus(newStatus);

          // Update compact stats reactively
          updateCompactStats(newStatus, turns, durationS);

          const el = document.createElement('div');
          el.className = 'cc-session-boundary';
          el.textContent = isSuccess
            ? `Session complete · ${turns} turns · ${durationS}s${cost}`
            : `Session error (${msg.subtype ?? 'unknown'}) · ${turns} turns · ${durationS}s`;
          nodes.push(el);
          break;
        }

        case 'auth_status': {
          if (msg.error) {
            const el = document.createElement('div');
            el.className = 'cc-error-line';
            el.textContent = `Auth error: ${msg.error}`;
            nodes.push(el);
          } else if (msg.isAuthenticating) {
            const el = document.createElement('div');
            el.className = 'cc-system-line';
            el.textContent = 'Authenticating…';
            nodes.push(el);
          }
          break;
        }

        case 'tool_progress':
        case 'stream_event':
        default:
          break;
      }

      return nodes;
    }

    // =========================================================
    // EXPANDED FULL RENDER (from lines array)
    // =========================================================

    function renderExpanded(lines) {
      const transcript = document.getElementById('transcript');

      // Reset state
      pendingToolUses.clear();
      sessionModel = '';
      sessionCwd = '';
      sessionStatus = 'running';

      const fragment = document.createDocumentFragment();

      for (const line of lines) {
        if (!line || !line.trim()) continue;
        let msg;
        try { msg = JSON.parse(line); } catch { continue; }

        const nodes = renderMessageToDom(msg);
        for (const node of nodes) {
          fragment.appendChild(node);
        }
      }

      if (!fragment.hasChildNodes()) {
        const empty = document.createElement('div');
        empty.className = 'cc-empty';
        empty.textContent = 'No output yet.';
        fragment.appendChild(empty);
      }

      transcript.replaceChildren(fragment);
    }

    // =========================================================
    // INCREMENTAL APPEND (for new lines while expanded)
    // =========================================================

    function appendExpandedLine(line) {
      if (!line || !line.trim()) return;
      let msg;
      try { msg = JSON.parse(line); } catch { return; }

      const nodes = renderMessageToDom(msg);
      const transcript = document.getElementById('transcript');

      // Remove empty placeholder if present
      const empty = transcript.querySelector('.cc-empty');
      if (empty && nodes.length > 0) empty.remove();

      for (const node of nodes) {
        transcript.appendChild(node);
      }
    }

    // =========================================================
    // INCREMENTAL COMPACT UPDATE (for new lines while compact)
    // =========================================================

    function updateCompactFromLine(line) {
      if (!line || !line.trim()) return;
      let msg;
      try { msg = JSON.parse(line); } catch { return; }

      // Track first user prompt
      if (msg.type === 'user' && !msg.tool_use_result) {
        const content = msg.message?.content;
        let text = '';
        if (typeof content === 'string') {
          text = content;
        } else if (Array.isArray(content)) {
          for (const block of content) {
            if (block?.type === 'text' && typeof block.text === 'string') {
              text += (text ? '\n\n' : '') + block.text;
            }
          }
        }
        const cleaned = stripMarkup(text);
        const looksLikeData = /^\s*[{[<]/.test(cleaned);
        if (cleaned && !looksLikeData && !compactPromptText) {
          compactPromptText = cleaned;
          // Update prompt display in place
          const promptEl = document.querySelector('.cc-compact-prompt');
          if (promptEl) {
            promptEl.innerHTML = escapeHtml(compactPromptText);
          }
        }
      }

      // Update stats on result
      if (msg.type === 'result') {
        const turns = msg.num_turns ?? 0;
        const durationS = Math.round((msg.duration_ms ?? 0) / 1000);
        const newStatus = msg.subtype === 'success' ? 'success' : 'error';
        updateCompactStats(newStatus, turns, durationS);
      }
    }

    // =========================================================
    // MODE SWITCHING
    // =========================================================

    let currentMode = 'hidden';

    function applyMode(mode) {
      const prev = currentMode;
      currentMode = mode;

      document.body.className = `mode-${mode}`;

      // On first expand: render expanded from current lines
      if (mode === 'expanded' && prev !== 'expanded') {
        const state = streamStore.getState();
        const file = state.files.get(state.primary);
        renderExpanded(file ? file.lines : []);
      }
    }

    // =========================================================
    // BOOTSTRAP
    // =========================================================

    observeHeight();

    const initState = streamStore.getState();
    const initMode = initState.mode;
    const initFile = initState.files.get(initState.primary);
    const initLines = initFile ? initFile.lines : [];

    // Seed metaTitle from stream meta so compact has a meaningful fallback
    metaTitle = initFile?.meta?.title ?? '';

    // Derive initial compact status from meta so completed/error sessions don't
    // falsely show "running" before line-parsing finds a result line.
    const metaStatus = initFile?.meta?.status;
    const initCompactStatus =
      metaStatus === 'completed' ? 'success' :
      metaStatus === 'error'     ? 'error'   :
      'running';

    // Initialize compact view immediately (always needed for compact mode)
    renderCompact(initLines, initCompactStatus);

    // Apply initial mode
    applyMode(initMode === 'hidden' ? 'compact' : initMode);

    // =========================================================
    // STORE SUBSCRIPTION — LIVE UPDATES
    // =========================================================

    let lastLineCount = initLines.length;

    streamStore.subscribe((newState) => {
      const file = newState.files.get(newState.primary);
      const lines = file ? file.lines : [];

      // Handle mode transitions
      if (newState.mode !== currentMode) {
        applyMode(newState.mode);
        // After mode switch reset line tracking
        lastLineCount = lines.length;
        return;
      }

      // Append new lines
      const newLines = lines.slice(lastLineCount);
      lastLineCount = lines.length;

      if (newLines.length === 0) return;

      if (currentMode === 'compact') {
        for (const line of newLines) {
          updateCompactFromLine(line);
        }
      } else if (currentMode === 'expanded') {
        for (const line of newLines) {
          appendExpandedLine(line);
        }
      }
    });
  </script>
</body>
</html>
