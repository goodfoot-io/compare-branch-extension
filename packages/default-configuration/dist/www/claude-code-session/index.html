<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Code Session</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--vscode-font-family, monospace);
      font-size: var(--vscode-font-size, 13px);
      color: var(--vscode-foreground, #cccccc);
      background: var(--vscode-editor-background, #1e1e1e);
      padding: 8px;
      overflow: hidden;
    }

    .cc-session {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cc-turn {
      padding: 6px 8px;
      border-radius: 4px;
    }

    .cc-assistant {
      background: var(--vscode-editor-inactiveSelectionBackground, #2a2d2e);
    }

    .cc-user {
      background: var(--vscode-editorWidget-background, #252526);
      border-left: 2px solid var(--vscode-focusBorder, #007fd4);
      padding-left: 10px;
    }

    .cc-system {
      font-size: 0.85em;
      color: var(--vscode-descriptionForeground, #858585);
      padding: 4px 8px;
    }

    .cc-session-start,
    .cc-session-end {
      border-top: 1px solid var(--vscode-panel-border, #3c3c3c);
      border-bottom: 1px solid var(--vscode-panel-border, #3c3c3c);
      padding: 4px 8px;
    }

    .cc-text p {
      margin: 0 0 4px;
    }

    .cc-text p:last-child {
      margin-bottom: 0;
    }

    .cc-text code {
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 0.9em;
      background: var(--vscode-textCodeBlock-background, #0a0a0a);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .cc-text pre {
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 0.9em;
      background: var(--vscode-textCodeBlock-background, #0a0a0a);
      padding: 8px;
      border-radius: 3px;
      overflow-x: auto;
      margin: 4px 0;
    }

    .cc-text pre code {
      background: none;
      padding: 0;
    }

    .cc-thinking {
      color: var(--vscode-descriptionForeground, #858585);
      font-style: italic;
      font-size: 0.9em;
      padding: 4px 8px;
      border-left: 2px solid var(--vscode-descriptionForeground, #858585);
    }

    .cc-thinking-label {
      font-weight: bold;
      margin-bottom: 2px;
    }

    .cc-tool-pair {
      padding: 4px 8px;
      border-left: 2px solid var(--vscode-charts-blue, #4fc1ff);
    }

    .cc-tool-badge {
      display: inline-block;
      font-size: 0.8em;
      font-family: var(--vscode-editor-font-family, monospace);
      background: var(--vscode-badge-background, #4d4d4d);
      color: var(--vscode-badge-foreground, #ffffff);
      padding: 1px 5px;
      border-radius: 3px;
      margin-bottom: 4px;
    }

    .cc-tool-input {
      border-collapse: collapse;
      font-size: 0.85em;
      font-family: var(--vscode-editor-font-family, monospace);
      width: 100%;
    }

    .cc-tool-input td {
      padding: 1px 4px;
      vertical-align: top;
    }

    .cc-tool-input-key {
      color: var(--vscode-symbolIcon-propertyForeground, #9cdcfe);
      text-align: right;
      white-space: nowrap;
    }

    .cc-tool-input-val {
      color: var(--vscode-foreground, #cccccc);
      word-break: break-all;
    }

    .cc-tool-result {
      font-size: 0.85em;
      color: var(--vscode-descriptionForeground, #858585);
      padding: 2px 8px;
    }

    .cc-compact-boundary hr {
      border: none;
      border-top: 1px dashed var(--vscode-panel-border, #3c3c3c);
      margin: 2px 0;
    }

    .cc-hook {
      font-size: 0.8em;
      color: var(--vscode-descriptionForeground, #858585);
    }

    .cc-empty {
      color: var(--vscode-descriptionForeground, #858585);
      font-style: italic;
      padding: 16px 8px;
    }
  </style>
</head>
<body>
  <div class="cc-session" id="root"></div>

  <script type="module">
function postToHost(message){window.parent.postMessage(message,"*")}function subscribe(filename){postToHost({type:"subscribe",filename})}function setHeight(px){postToHost({type:"setHeight",height:px})}var createStoreImpl=createState=>{let state2;const listeners=new Set;const setState=(partial,replace)=>{const nextState=typeof partial==="function"?partial(state2):partial;if(!Object.is(nextState,state2)){const previousState=state2;state2=(replace!=null?replace:typeof nextState!=="object"||nextState===null)?nextState:Object.assign({},state2,nextState);listeners.forEach(listener=>listener(state2,previousState))}};const getState=()=>state2;const getInitialState=()=>initialState;const subscribe2=listener=>{listeners.add(listener);return()=>listeners.delete(listener)};const api={setState,getState,getInitialState,subscribe:subscribe2};const initialState=state2=createState(setState,getState,api);return api};var createStore=(createState=>createState?createStoreImpl(createState):createStoreImpl);function buildInitialState(init2){const files=new Map;for(const[filename,data]of Object.entries(init2.files)){files.set(filename,{filename,meta:data.meta,lines:[...data.lines],isSubscribed:filename===init2.primary,isLoading:false,error:null})}return{primary:init2.primary,files,availableFiles:[...init2.availableFiles],connected:true}}function applyMessage(state2,msg){switch(msg.type){case"stream:line":{const file=state2.files.get(msg.filename);if(!file)return null;const updated=new Map(state2.files);updated.set(msg.filename,{...file,lines:[...file.lines,msg.line],meta:{...file.meta,lineCount:file.meta.lineCount+1}});return{files:updated}}case"stream:started":{const file=state2.files.get(msg.filename);const updated=new Map(state2.files);updated.set(msg.filename,{filename:msg.filename,meta:msg.meta,lines:file?.lines??[],isSubscribed:file?.isSubscribed??false,isLoading:file?.isLoading??false,error:file?.error??null});return{files:updated}}case"stream:ended":{const file=state2.files.get(msg.filename);if(!file)return null;const updated=new Map(state2.files);updated.set(msg.filename,{...file,meta:msg.meta});return{files:updated}}case"availableFiles:update":{return{availableFiles:[...msg.files]}}case"subscribe:response":{const updated=new Map(state2.files);if(msg.error){const existing=state2.files.get(msg.filename);updated.set(msg.filename,{filename:msg.filename,meta:existing?.meta??msg.meta,lines:existing?.lines??[],isSubscribed:false,isLoading:false,error:msg.error})}else{updated.set(msg.filename,{filename:msg.filename,meta:msg.meta,lines:[...msg.lines],isSubscribed:true,isLoading:false,error:null})}return{files:updated}}case"visibility:change":{return null}default:return null}}var init=window.__STREAM_INIT__;if(!init){throw new Error("Stream store requires window.__STREAM_INIT__ to be set by the host")}var streamStore=createStore()(()=>buildInitialState(init));window.addEventListener("message",event=>{const msg=event.data;if(!msg||typeof msg!=="object"||!("type"in msg))return;const patch=applyMessage(streamStore.getState(),msg);if(patch){streamStore.setState(patch)}});function escapeHtml(text){return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}var VALUE_TRUNCATE_LENGTH=120;function truncateValue(value){if(value.length>VALUE_TRUNCATE_LENGTH){return`${value.slice(0,VALUE_TRUNCATE_LENGTH)}...`}return value}function formatInputValue(value){if(typeof value==="string"){return escapeHtml(truncateValue(value))}if(value===null||value===void 0){return"<em>null</em>"}return escapeHtml(truncateValue(JSON.stringify(value)))}function formatToolInputTable(name,input){const nameEscaped=escapeHtml(name);const entries=Object.entries(input??{});let rows="";for(const[key,value]of entries){rows+=`<tr><td class="cc-tool-input-key">${escapeHtml(key)}</td><td class="cc-tool-input-val">${formatInputValue(value)}</td></tr>`}const table=rows.length>0?`<table class="cc-tool-input">${rows}</table>`:"";return`<div class="cc-tool-pair" data-tool="${nameEscaped}"><span class="cc-tool-badge">${nameEscaped}</span>${table}</div>`}function formatTextContent(text){return`<div class="cc-text">${escapeHtml(text).replace(/\n/g,"<br>")}</div>`}var pendingToolUses=new Map;function renderLine(line){if(!line||!line.trim())return"";let message;try{message=JSON.parse(line)}catch{return""}switch(message.type){case"system":{switch(message.subtype){case"init":{const model=escapeHtml(message.model||"");const toolsCount=message.tools?.length||0;const cwd=escapeHtml(message.cwd||"");return`<div class="cc-system cc-session-start"><strong>Session Started</strong> | ${model} | ${toolsCount} tools | ${cwd}</div>`}case"status":{if(message.status==="compacting"){return'<div class="cc-system"><em>Compacting context...</em></div>'}return""}case"compact_boundary":{const trigger=escapeHtml(message.compact_metadata?.trigger??"auto");const preTokens=message.compact_metadata?.pre_tokens??0;return`<div class="cc-system cc-compact-boundary"><hr><em>Context compacted</em> (${trigger}) \u2014 ${preTokens} tokens before<hr></div>`}case"hook_started":{const name=escapeHtml(message.hook_name??"");const event=escapeHtml(message.hook_event??"");return`<div class="cc-system cc-hook">Hook <strong>${name}</strong> (${event}) started</div>`}case"hook_progress":{const name=escapeHtml(message.hook_name??"");const output=escapeHtml(message.output??message.stdout??"");return`<div class="cc-system cc-hook">Hook <strong>${name}</strong>: ${output}</div>`}case"hook_response":{const name=escapeHtml(message.hook_name??"");if(message.outcome==="success"){return`<div class="cc-system cc-hook">Hook <strong>${name}</strong> completed</div>`}else if(message.outcome==="error"){return`<div class="cc-system cc-hook">Hook <strong>${name}</strong> failed (exit ${message.exit_code??"?"})</div>`}else if(message.outcome==="cancelled"){return`<div class="cc-system cc-hook">Hook <strong>${name}</strong> cancelled</div>`}return`<div class="cc-system cc-hook">Hook <strong>${name}</strong> ${escapeHtml(String(message.outcome??""))}</div>`}case"files_persisted":{const saved=message.files?.length??0;const failed=message.failed?.length??0;if(failed>0){return`<div class="cc-system">Files persisted: ${saved} saved, ${failed} failed</div>`}return`<div class="cc-system">Files persisted: ${saved} saved</div>`}case"task_notification":{const status=escapeHtml(message.status||"unknown");const summary=escapeHtml(message.summary||"");const taskId=escapeHtml(message.task_id??"");return`<div class="cc-system"><strong>Task</strong> <em>${taskId}</em> \u2014 ${status}: ${summary}</div>`}default:return""}}case"assistant":{if(message.error){return`<div class="cc-turn cc-assistant"><div class="cc-system"><strong>API Error</strong> (${escapeHtml(String(message.error))})</div></div>`}const blocks=message.message?.content??[];for(const block of blocks){if(block.type==="tool_use"){pendingToolUses.set(block.id,{name:block.name,input:block.input??{}})}}const nonToolBlocks=blocks.filter(b=>b.type!=="tool_use");if(nonToolBlocks.length===0)return"";let inner="";for(const block of nonToolBlocks){if(block.type==="text"){inner+=formatTextContent(block.text??"")}else if(block.type==="thinking"){inner+=`<div class="cc-thinking"><div class="cc-thinking-label">Thinking</div>${escapeHtml(block.thinking??"")}</div>`}}if(!inner)return"";return`<div class="cc-turn cc-assistant">${inner}</div>`}case"user":{if(message.tool_use_result!==void 0&&message.tool_use_result!==null){return""}const content=message.message?.content;let text="";if(typeof content==="string"){text=formatTextContent(content)}else if(Array.isArray(content)){for(const block of content){if(block?.type==="text"&&typeof block.text==="string"){text+=formatTextContent(block.text)}}}if(!text)return"";return`<div class="cc-turn cc-user">${text}</div>`}case"tool_use_summary":{const summary=escapeHtml(message.summary||"");const ids=message.preceding_tool_use_ids??[];let toolHeader="";for(const id of ids){const pending=pendingToolUses.get(id);if(pending){toolHeader+=formatToolInputTable(pending.name,pending.input);pendingToolUses.delete(id)}}return`${toolHeader}<div class="cc-tool-result">${summary}</div>`}case"result":{const turns=message.num_turns??0;const durationMs=message.duration_ms??0;const durationS=Math.round(durationMs/1e3);const cost=message.total_cost_usd??0;const stats=`${turns} turns | ${durationS}s | ${cost}`;if(message.subtype==="success"){return`<div class="cc-system cc-session-end"><strong>Session Complete</strong> | ${stats}</div>`}return`<div class="cc-system cc-session-end"><strong>Session Error</strong> (${escapeHtml(message.subtype??"")}) | ${stats}</div>`}case"auth_status":{if(message.error){return`<div class="cc-system"><strong>Auth error:</strong> ${escapeHtml(message.error)}</div>`}if(message.isAuthenticating){return'<div class="cc-system"><em>Authenticating...</em></div>'}return""}case"tool_progress":case"stream_event":return"";default:return""}}var root=document.getElementById("root");function render(lines){const html=lines.map(renderLine).filter(Boolean).join("");root.innerHTML=html||'<div class="cc-empty">No output yet.</div>';setHeight(document.body.scrollHeight)}var state=streamStore.getState();var primaryFile=state.files.get(state.primary);if(primaryFile){render(primaryFile.lines)}else{root.innerHTML='<div class="cc-empty">No output yet.</div>';setHeight(document.body.scrollHeight);subscribe(state.primary)}streamStore.subscribe(newState=>{const file=newState.files.get(newState.primary);if(file){render(file.lines)}});

  </script>
</body>
</html>
